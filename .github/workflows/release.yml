name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        run: |
          VERSION=$(grep -m1 'Version:' isudev-consent.php | awk '{print $NF}' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          grep -Eq "const VERSION[[:space:]]*=[[:space:]]*'$VERSION';" isudev-consent.php
          grep -q "^Stable tag: $VERSION$" readme.txt
          grep -q '"version": "'$VERSION'"' composer.json

      - name: Assert pushed tag matches version
        if: github.ref_type == 'tag'
        run: test "${{ github.ref_name }}" = "${{ steps.version.outputs.tag }}"

      - name: Create release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/isudev-consent
          rsync -a --exclude-from=- ./ dist/isudev-consent/ <<'EOF'
          /.git/
          /.github/
          /.agents/
          /.claude/
          /.superpowers/
          /dist/
          /tests/
          /tools/
          /AGENTS.MD
          /CLAUDE.MD
          /CODEX.md
          /GEMINI.md
          /.DS_Store
          /composer.json
          /composer.lock
          /package.json
          /node_modules/
          EOF
          cd dist && zip -rq "../isudev-consent-${VERSION}.zip" isudev-consent

      - name: Assert artifact contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ROOT=dist/isudev-consent
          test -f "$ROOT/isudev-consent.php"
          test -f "$ROOT/includes/update-checker.php"
          test -f "$ROOT/vendor/autoload.php"
          test -f "$ROOT/readme.txt"
          test -f "isudev-consent-${VERSION}.zip"
          if unzip -l "isudev-consent-${VERSION}.zip" | grep -E '(/\.git/|/\.github/|/\.agents/|/AGENTS\.M?D$|/composer\.json$|/package\.json$)' ; then
            echo 'Development files leaked into the release artifact.'
            exit 1
          fi

      - name: Extract changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="= $VERSION =" '$0 == v { found=1; next } found && /^= [0-9]+\.[0-9]+/ { exit } found { print }' readme.txt > changelog-section.md
          test -s changelog-section.md
          {
            echo '## Changelog'
            echo
            sed 's/^\* /- /' changelog-section.md
            echo
            echo '---'
            echo
            echo "**Install:** download \`isudev-consent-${VERSION}.zip\` below and install it as a plugin, or let the built-in updater offer it."
          } > release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: isudev-consent-${{ steps.version.outputs.version }}.zip
          body_path: release-body.md
